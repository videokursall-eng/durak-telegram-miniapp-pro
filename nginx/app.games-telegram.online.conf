# Nginx config for app.games-telegram.online (VPS production).
# Place in: /etc/nginx/sites-available/app.games-telegram.online
# Enable: sudo ln -s /etc/nginx/sites-available/app.games-telegram.online /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
#
# Then get SSL: sudo certbot --nginx -d app.games-telegram.online
# Certbot will add HTTPS and redirect HTTP→HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name app.games-telegram.online;

    access_log /var/log/nginx/app.games-telegram.online.access.log;
    error_log  /var/log/nginx/app.games-telegram.online.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
